<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pirate Adventure</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0c1118; overflow: hidden; }
    #loading {
      position: fixed; inset: 0; display: grid; place-items: center;
      color: #8d9bad; font: 500 15px/1.5 ui-monospace, "SFMono-Regular", monospace;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="loading">loading game…</div>
  <script src="wasm_exec.js"></script>
  <script>
    const go = new Go();
    WebAssembly.instantiateStreaming(fetch("game.wasm"), go.importObject)
      .then((result) => {
        const el = document.getElementById("loading");
        if (el) el.remove();
        go.run(result.instance);
      })
      .catch((err) => {
        const el = document.getElementById("loading");
        if (el) el.textContent = "failed to load: " + err;
        console.error(err);
      });
  </script>
</body>
</html>
